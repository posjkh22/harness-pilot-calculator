<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계산기</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator" data-testid="calculator">
    <output class="display" data-testid="display" aria-live="polite">0</output>
    <div class="keypad" aria-label="계산기 버튼">
      <button type="button" data-action="7" data-testid="digit-7">7</button>
      <button type="button" data-action="8" data-testid="digit-8">8</button>
      <button type="button" data-action="9" data-testid="digit-9">9</button>
      <button type="button" data-action="/" data-testid="operator-/">/</button>
      <button type="button" data-action="4" data-testid="digit-4">4</button>
      <button type="button" data-action="5" data-testid="digit-5">5</button>
      <button type="button" data-action="6" data-testid="digit-6">6</button>
      <button type="button" data-action="*" data-testid="operator-*">*</button>
      <button type="button" data-action="1" data-testid="digit-1">1</button>
      <button type="button" data-action="2" data-testid="digit-2">2</button>
      <button type="button" data-action="3" data-testid="digit-3">3</button>
      <button type="button" data-action="-" data-testid="operator--">-</button>
      <button type="button" data-action="0" data-testid="digit-0">0</button>
      <button type="button" data-action="C" data-testid="clear">C</button>
      <button type="button" data-action="=" data-testid="equals">=</button>
      <button type="button" data-action="+" data-testid="operator-+">+</button>
    </div>
  </main>
  <script src="calculator.js"></script>
</body>
</html>
