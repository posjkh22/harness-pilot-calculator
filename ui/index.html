<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <output class="display" data-testid="display" aria-live="polite">0</output>
    <section class="keypad" aria-label="Calculator keys">
      <button type="button" data-testid="digit-0" data-action="digit" data-digit="0" aria-label="0">0</button>
      <button type="button" data-testid="digit-1" data-action="digit" data-digit="1" aria-label="1">1</button>
      <button type="button" data-testid="digit-2" data-action="digit" data-digit="2" aria-label="2">2</button>
      <button type="button" data-testid="digit-3" data-action="digit" data-digit="3" aria-label="3">3</button>
      <button type="button" data-testid="digit-4" data-action="digit" data-digit="4" aria-label="4">4</button>
      <button type="button" data-testid="digit-5" data-action="digit" data-digit="5" aria-label="5">5</button>
      <button type="button" data-testid="digit-6" data-action="digit" data-digit="6" aria-label="6">6</button>
      <button type="button" data-testid="digit-7" data-action="digit" data-digit="7" aria-label="7">7</button>
      <button type="button" data-testid="digit-8" data-action="digit" data-digit="8" aria-label="8">8</button>
      <button type="button" data-testid="digit-9" data-action="digit" data-digit="9" aria-label="9">9</button>
      <button type="button" data-testid="operator-add" data-action="operator" data-operator="+" aria-label="+">+</button>
      <button type="button" data-testid="operator-subtract" data-action="operator" data-operator="-" aria-label="-">-</button>
      <button type="button" data-testid="operator-multiply" data-action="operator" data-operator="*" aria-label="*">*</button>
      <button type="button" data-testid="operator-divide" data-action="operator" data-operator="/" aria-label="/">/</button>
      <button type="button" data-testid="equals" data-action="equals" aria-label="=">=</button>
      <button type="button" data-testid="clear" data-action="clear" aria-label="Clear">Clear</button>
    </section>
  </main>
  <script src="calculator.js"></script>
</body>
</html>
